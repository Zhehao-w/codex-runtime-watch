[package]
name = "codex-runtime-watch"
version = "0.1.0"
edition = "2021"

[lib]
name = "codex_runtime_watch"
path = "src/lib.rs"

[[bin]]
name = "codex-runtime-watch"
path = "src/main.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:tauri", "dep:tauri-plugin-notification", "dep:tauri-plugin-autostart", "dep:opener"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
notify = "8"
opener = { version = "0.8", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
