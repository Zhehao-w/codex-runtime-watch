name: Release artifacts
on: { push: { tags: ['v*'] } }
permissions: { contents: write }
jobs:
  build:
    strategy: { matrix: { include: [{ os: windows-latest, args: "--target x86_64-pc-windows-msvc" }, { os: macos-14, args: "--target aarch64-apple-darwin" }] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tauri build -- --features desktop ${{ matrix.args }}
      - uses: softprops/action-gh-release@v2
        with: { files: "src-tauri/target/**/release/bundle/**/*" }
