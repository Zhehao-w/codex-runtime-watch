name: Release artifacts
on: { push: { tags: ['v*'] } }
permissions: { contents: write }
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag and application versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME;
          const packageVersion = require('./package.json').version;
          const tauriVersion = require('./src-tauri/tauri.conf.json').version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expected = `v${packageVersion}`;
          if (!cargoVersion || packageVersion !== cargoVersion || packageVersion !== tauriVersion || tag !== expected) {
            console.error({ tag, packageVersion, cargoVersion, tauriVersion, expected });
            process.exit(1);
          }
          NODE
  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles msi,nsis"
            files: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: macos-14
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate-icons
      - run: npm run tauri build -- --features desktop ${{ matrix.args }}
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
